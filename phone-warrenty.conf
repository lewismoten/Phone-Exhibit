; =========================================================
; Restoring the Signal
; Phone Warranty Adventure
; File:
; /etc/asterisk/custom/phone-warranty/phone-warranty.conf
; =========================================================

; Add this to extensions.conf
; #include custom/phone-warranty/phone-warranty.conf

; Add files to
; /var/lib/asterisk/sounds/custom/phone-warranty/
; start.wav
; timeout.wav
; model.wav
; blue.wav
; rotary.wav
; warranty.wav
; ghost.wav
; lightning.wav
; museum.wav
; supervisor.wav
; stillsupervisor.wav

[phone-warranty]

; ---------------------------------------------------------
; MAIN ENTRY
; ---------------------------------------------------------

exten => 4242,1,Answer()
 same => n,Playback(custom/phone-warranty/start)
 same => n,WaitExten(10)

exten => t,1,Playback(custom/phone-warranty/timeout)
 same => n,Goto(4242,1)

exten => i,1,Playback(pbx-invalid)
 same => n,Goto(4242,1)

; ---------------------------------------------------------
; MAIN MENU
; ---------------------------------------------------------

exten => 1,1,Goto(model,s,1)
exten => 2,1,Goto(warranty,s,1)
exten => 3,1,Goto(supervisor,s,1)

; =========================================================
; MODEL MENU
; =========================================================

[model]

exten => s,1,Playback(custom/phone-warranty/model)
 same => n,WaitExten(10)

exten => 1,1,Goto(blue,s,1)
exten => 2,1,Goto(rotary,s,1)

exten => t,1,Goto(phone-warranty,4242,1)
exten => i,1,Goto(phone-warranty,4242,1)

; =========================================================
; BLUE MENU
; =========================================================

[blue]

exten => s,1,Playback(custom/phone-warranty/blue)
 same => n,WaitExten(10)

exten => 1,1,Goto(supervisor,s,1)
exten => 2,1,Goto(warranty,s,1)

exten => t,1,Goto(phone-warranty,4242,1)
exten => i,1,Goto(phone-warranty,4242,1)

; =========================================================
; ROTARY MENU
; =========================================================

[rotary]

exten => s,1,Playback(custom/phone-warranty/rotary)
 same => n,WaitExten(10)

exten => 1,1,Goto(museum,s,1)
exten => 2,1,Goto(lightning,s,1)

exten => t,1,Goto(phone-warranty,4242,1)
exten => i,1,Goto(phone-warranty,4242,1)

; =========================================================
; WARRANTY MENU
; =========================================================

[warranty]

exten => s,1,Playback(custom/phone-warranty/warranty)
 same => n,WaitExten(10)

exten => 1,1,Goto(ghost,s,1)
exten => 2,1,Goto(lightning,s,1)

exten => t,1,Goto(phone-warranty,4242,1)
exten => i,1,Goto(phone-warranty,4242,1)

; =========================================================
; GHOST ENDING
; =========================================================

[ghost]

exten => s,1,Playback(custom/phone-warranty/ghost)
 same => n,Hangup()

; =========================================================
; LIGHTNING ENDING
; =========================================================

[lightning]

exten => s,1,Playback(custom/phone-warranty/lightning)
 same => n,Hangup()

; =========================================================
; MUSEUM ENDING
; =========================================================

[museum]

exten => s,1,Playback(custom/phone-warranty/museum)
 same => n,Hangup()

; =========================================================
; SUPERVISOR LOOP
; =========================================================

[supervisor]

exten => s,1,Playback(custom/phone-warranty/supervisor)
 same => n,Goto(hold-loop,s,1)

; =========================================================
; HOLD LOOP
; =========================================================

[hold-loop]
exten => s,1,MusicOnHold(phone-warrenty-moh,20)
 same => n,Playback(custom/phone-warranty/stillsupervisor)
 same => n,Goto(s,1)